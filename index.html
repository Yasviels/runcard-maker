<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Racerun">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Racerun Card Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Inter:wght@500;700;800;900&amp;display=swap">
<style>
/* Layout: a grey Figma-like stage holding the card on the left, a plain form on the right. */
:root{
  --bg:#EEF0F2; --panel:#FFFFFF; --ink:#101113; --muted:#5B6068; --line:#D5D8DD;
  --stage:#A9ABB0; --btn-bg:#101113; --btn-fg:#FFFFFF; --focus:#B23A3A;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --panel:#1A1B1E; --ink:#F1F2F3; --muted:#A3A8B0; --line:#2D2F34;
    --stage:#2B2C30; --btn-bg:#F1F2F3; --btn-fg:#101113; --focus:#E36A6A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --panel:#1A1B1E; --ink:#F1F2F3; --muted:#A3A8B0; --line:#2D2F34;
  --stage:#2B2C30; --btn-bg:#F1F2F3; --btn-fg:#101113; --focus:#E36A6A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:32px 48px;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-0.01em;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:52ch}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
.stage{background:var(--stage);border-radius:6px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stage canvas{display:block;width:100%;height:auto;background:#fff}
.cw{position:relative;width:100%}
.sz{position:absolute;left:0;right:0;background:rgba(178,58,58,.16);border:0 dashed rgba(178,58,58,.75);pointer-events:none}
.sz-top{top:0;border-bottom-width:2px}
.sz-bot{bottom:0;border-top-width:2px}
.chk{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.size{margin:0;font-size:12px;letter-spacing:.04em;color:#fff;text-transform:uppercase;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1 / -1}
label,.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select{
  font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;height:42px;padding:0 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=color]{height:42px;width:100%;padding:3px;border:1px solid var(--line);border-radius:4px;background:transparent;cursor:pointer}
input[type=range]{width:100%;height:42px;margin:0;accent-color:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button.b{font:inherit;font-weight:600;height:44px;padding:0 20px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.b.main{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);flex:1;min-width:160px}
.msg{min-height:20px;margin:0;font-size:13px;color:var(--muted)}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.stage{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Racerun Card Maker</h1>
    <p class="lede">Type your run, pick an accent and save the card as a PNG. Pace is worked out from distance and move time, and you can still overwrite it.</p>
  </header>

  <div class="grid">
    <div class="stage">
      <div class="cw">
        <canvas id="cv" width="1080" height="1920" role="img" aria-label="Preview of the running card"></canvas>
        <div class="sz sz-top" id="zt" aria-hidden="true"></div>
        <div class="sz sz-bot" id="zb" aria-hidden="true"></div>
      </div>
      <p class="size" id="size">1080 × 1920 px</p>
    </div>

    <div class="panel">
      <div class="row">
        <div class="f"><label for="brand">Brand</label><input id="brand" type="text" value="Racerun" autocomplete="off"></div>
        <div class="f"><label for="date">Date</label><input id="date" type="date" value="2026-10-19"></div>
        <div class="f full"><label for="title">Headline</label><input id="title" type="text" value="Run." autocomplete="off"></div>
        <div class="f"><label for="dist">Distance (km)</label><input id="dist" type="text" inputmode="decimal" value="5" autocomplete="off"></div>
        <div class="f"><label for="move">Move time</label><input id="move" type="text" value="31:00" placeholder="mm:ss or h:mm:ss" autocomplete="off"></div>
        <div class="f full"><label for="pace">Pace (min per km)</label><input id="pace" type="text" value="6.30" autocomplete="off"></div>
      </div>

      <div class="f">
        <span class="lab" id="acc-lab">Swoosh accent</span>
        <div class="swatches" role="group" aria-labelledby="acc-lab">
          <button type="button" class="sw" data-c="#B23A3A" style="background:#B23A3A" aria-label="Brick red" aria-pressed="true"></button>
          <button type="button" class="sw" data-c="#D9622B" style="background:#D9622B" aria-label="Orange" aria-pressed="false"></button>
          <button type="button" class="sw" data-c="#2F5FD0" style="background:#2F5FD0" aria-label="Blue" aria-pressed="false"></button>
          <button type="button" class="sw" data-c="#2E8B57" style="background:#2E8B57" aria-label="Green" aria-pressed="false"></button>
        </div>
      </div>

      <div class="row">
        <div class="f"><label for="bg">Background</label>
          <select id="bg"><option value="white">White</option><option value="clear">Transparent</option></select>
        </div>
        <div class="f"><label for="txt">Text color</label>
          <input id="txt" type="color" value="#0b0b0b">
        </div>
        <div class="f"><label for="shade">Shade color</label>
          <input id="shade" type="color" value="#0a0a0a">
        </div>
        <div class="f"><label for="shadeAmt">Shade strength</label>
          <input id="shadeAmt" type="range" min="0" max="100" step="1" value="100">
        </div>
      </div>

      <div class="row">
        <div class="f full"><label for="ratio">Size</label>
          <select id="ratio">
            <option value="1080x1920">Instagram Story, 1080 × 1920 (9:16)</option>
            <option value="1080x2190">Tall, 1080 × 2190 (as in the reference)</option>
            <option value="1080x1350">Instagram Post, 1080 × 1350 (4:5)</option>
            <option value="1080x1080">Square, 1080 × 1080</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="f"><label for="wpx">Width (px)</label><input id="wpx" type="number" min="320" max="4000" step="1" value="1080"></div>
        <div class="f"><label for="hpx">Height (px)</label><input id="hpx" type="number" min="320" max="4000" step="1" value="1920"></div>
        <div class="f full"><label class="chk" for="safe"><input id="safe" type="checkbox" checked>Keep inside the Instagram Story safe zone</label></div>
      </div>

      <div class="row">
        <div class="f"><label for="shape">Shape</label>
          <select id="shape">
            <option value="wave">Wave (reference)</option>
            <option value="climb">Climb</option>
            <option value="ripple">Ripple</option>
            <option value="peaks">Peaks</option>
            <option value="loop">Loop</option>
            <option value="arc">Smile</option>
            <option value="rise">Sunrise</option>
            <option value="edge">Edge</option>
          </select>
        </div>
        <div class="f"><label for="lines">Lines</label>
          <select id="lines"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
        </div>
        <div class="f"><label for="thick">Thickness</label><input id="thick" type="range" min="40" max="220" step="1" value="100"></div>
        <div class="f"><label for="soft">Softness</label><input id="soft" type="range" min="10" max="220" step="1" value="100"></div>
        <div class="f"><label for="off">Accent offset</label><input id="off" type="range" min="0" max="200" step="1" value="100"></div>
        <div class="f"><label for="ypos">Height</label><input id="ypos" type="range" min="-30" max="30" step="1" value="0"></div>
        <div class="f"><label for="wob">Wobble</label><input id="wob" type="range" min="0" max="100" step="1" value="0"></div>
        <div class="f"><span class="lab">Random</span><button type="button" class="b" id="shuffle">Shuffle shape</button></div>
      </div>

      <div class="actions">
        <button type="button" class="b main" id="dl">Download PNG</button>
        <button type="button" class="b" id="share">Share or save to Photos</button>
      </div>
      <p class="msg" id="msg" aria-live="polite"></p>
    </div>
  </div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var $=function(id){return document.getElementById(id)};
  var state={accent:'#B23A3A',w:1080,h:1920,seed:1};
  var FONT='Inter,"Helvetica Neue",Arial,sans-serif';
  var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

  function fmtDate(v){
    if(!v) return '';
    var p=v.split('-').map(Number), dt=new Date(Date.UTC(p[0],p[1]-1,p[2]));
    var d=p[2]<10?'0'+p[2]:''+p[2];
    return DAYS[dt.getUTCDay()]+', '+d+' '+MONTHS[p[1]-1]+' '+p[0];
  }
  function num(s){return parseFloat(String(s).replace(',','.'))}
  function fmtDist(){
    var v=num($('dist').value);
    return isNaN(v)?$('dist').value:String(Math.round(v*100)/100);
  }
  function parseT(s){
    var p=s.trim().split(':').map(Number);
    if(p.length<2||p.length>3||p.some(isNaN)) return null;
    return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
  }
  function autoPace(){
    var d=num($('dist').value), t=parseT($('move').value);
    if(!(d>0)||t===null) return;
    var s=Math.round(t/d), m=Math.floor(s/60), r=s%60;
    $('pace').value=m+'.'+(r<10?'0':'')+r;
  }
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  var SHAPES={
    wave:[[-0.08,1.05],[0.155,0.943],[0.42,0.885],[0.7125,0.827],[0.884,0.748],[1.08,0.62]],
    climb:[[-0.1,1.1],[0.25,1.0],[0.5,0.86],[0.75,0.68],[1.1,0.42]],
    ripple:[[-0.1,0.98],[0.1,0.92],[0.28,1.0],[0.48,0.9],[0.68,0.97],[0.88,0.85],[1.1,0.9]],
    peaks:[[-0.1,1.02],[0.15,0.93],[0.3,0.96],[0.5,0.78],[0.62,0.86],[0.8,0.72],[1.1,0.8]],
    loop:[[-0.1,1.0],[0.2,0.95],[0.45,0.88],[0.68,0.8],[0.86,0.84],[0.88,0.94],[0.74,0.97],[0.66,0.88],[0.8,0.74],[1.1,0.6]],
    arc:[[-0.1,0.88],[0.2,0.97],[0.5,0.99],[0.8,0.92],[1.1,0.74]],
    rise:[[-0.1,0.96],[0.3,0.97],[0.6,0.93],[0.85,0.8],[1.1,0.5]],
    edge:[[1.05,1.1],[0.85,0.92],[0.97,0.72],[0.8,0.52],[1.0,0.3],[0.9,0.1]]
  };
  function swoosh(pts,W,H,wob){
    var r=rng(state.seed), n=pts.length;
    var q=pts.map(function(a,i){
      var m=(i===0||i===n-1)?0.3:1;
      return [(a[0]+(r()-0.5)*wob*m)*W,(a[1]+(r()-0.5)*wob*m)*H];
    });
    var p=new Path2D();
    p.moveTo(q[0][0],q[0][1]);
    for(var i=0;i<n-1;i++){
      var a=q[Math.max(0,i-1)], b=q[i], c=q[i+1], d=q[Math.min(n-1,i+2)];
      p.bezierCurveTo(b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6,c[0]-(d[0]-b[0])/6,c[1]-(d[1]-b[1])/6,c[0],c[1]);
    }
    return p;
  }
  function band(p,color,w,blur,alpha,dy){
    var L=30;
    ctx.save();
    ctx.translate(0,dy);
    ctx.strokeStyle=color; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.globalAlpha=alpha;
    for(var i=0;i<L;i++){ ctx.lineWidth=Math.max(1,w+blur*(1-2*i/(L-1))); ctx.stroke(p); }
    ctx.restore();
  }
  function spacing(v){ try{ ctx.letterSpacing=v; }catch(e){} }

  function draw(){
    var W=state.w, H=state.h, s=Math.min(W/1080,H/1500), safe=$('safe').checked;
    if(cv.width!==W) cv.width=W;
    if(cv.height!==H) cv.height=H;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha=1;
    var clear=$('bg').value==='clear';
    ctx.clearRect(0,0,W,H);
    if(!clear){ ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H); }
    cv.style.background=clear?'transparent':'#FFFFFF';
    var ink=$('txt').value, mx=Math.round(W*0.095);

    var pts=SHAPES[$('shape').value]||SHAPES.wave;
    var thick=$('thick').value/100, soft=$('soft').value/100, off=$('off').value/100;
    var wob=$('wob').value/100*0.09, lines=parseInt($('lines').value,10), yS=-$('ypos').value/100*H;
    var amt=$('shadeAmt').value/100, gap=H*0.065;
    var pth=swoosh(pts,W,H,wob);
    for(var li=lines-1;li>=0;li--){
      var k=1-0.28*li, fade=li===0?1:0.85, dy=yS-li*gap;
      band(pth,state.accent,W*0.15*thick*k,W*0.11*soft*k,0.12*fade,dy+H*0.04*off);
      band(pth,$('shade').value,W*0.12*thick*k,W*0.085*soft*k,0.14*amt*fade,dy);
    }

    ctx.fillStyle=ink; ctx.textBaseline='alphabetic';
    var base=safe?Math.round(H*0.13+41*s):Math.round(164*s);
    ctx.textAlign='left'; ctx.font='800 '+Math.round(56*s)+'px '+FONT; spacing('-1px');
    var brand=$('brand').value||'Racerun';
    ctx.fillText(brand,mx,base);
    var bw=ctx.measureText(brand).width;

    spacing('0px'); ctx.font='500 '+Math.round(31*s)+'px '+FONT; ctx.textAlign='right';
    var dt=fmtDate($('date').value);
    ctx.fillText(dt,W-mx,base);
    var dw=ctx.measureText(dt).width;
    var x1=mx+bw+26*s, x2=W-mx-dw-26*s;
    if(x2>x1) ctx.fillRect(x1,base-12*s,x2-x1,Math.max(2,Math.round(3*s)));

    var runY=Math.round(H*(safe?0.70:0.728));
    ctx.textAlign='left'; ctx.font='900 '+Math.round(205*s)+'px '+FONT; spacing(Math.round(-9*s)+'px');
    ctx.fillText($('title').value||'Run.',mx,runY);

    spacing('-0.5px'); ctx.font='800 '+Math.round(48*s)+'px '+FONT;
    ctx.fillText('Distance/'+fmtDist()+' KM',mx,runY+68*s);
    ctx.fillText('Move/'+($('move').value||'00:00'),mx,runY+126*s);
    ctx.fillText('Pace/'+($('pace').value||'0.00'),mx,runY+184*s);
    spacing('0px');
    $('size').textContent=W+' × '+H+' px';
  }

  var raf=0;
  function schedule(){ if(raf) return; raf=requestAnimationFrame(function(){raf=0;draw()}); }

  ['brand','date','title','pace'].forEach(function(id){ $(id).addEventListener('input',schedule); });
  ['dist','move'].forEach(function(id){ $(id).addEventListener('input',function(){autoPace();schedule()}); });
  ['bg','txt','shade','shadeAmt','shape','lines','thick','soft','off','ypos','wob'].forEach(function(id){ $(id).addEventListener('input',schedule); $(id).addEventListener('change',schedule); });
  function clampPx(v,d){ v=parseInt(v,10); if(isNaN(v)) return d; return Math.max(320,Math.min(4000,v)); }
  function guide(){
    var on=$('safe').checked;
    $('zt').hidden=!on; $('zb').hidden=!on;
    $('zt').style.height=(250/1920*100)+'%';
    $('zb').style.height=(340/1920*100)+'%';
  }
  $('ratio').addEventListener('change',function(){
    if(this.value==='custom') return;
    var p=this.value.split('x');
    state.w=parseInt(p[0],10); state.h=parseInt(p[1],10);
    $('wpx').value=state.w; $('hpx').value=state.h;
    schedule();
  });
  ['wpx','hpx'].forEach(function(id){
    $(id).addEventListener('input',function(){
      state.w=clampPx($('wpx').value,state.w); state.h=clampPx($('hpx').value,state.h);
      var key=state.w+'x'+state.h, sel=$('ratio');
      sel.value='custom';
      Array.prototype.forEach.call(sel.options,function(o){ if(o.value===key) sel.value=key; });
      schedule();
    });
  });
  $('safe').addEventListener('change',function(){ guide(); schedule(); });
  guide();
  $('shuffle').addEventListener('click',function(){
    state.seed=2+Math.floor(Math.random()*100000);
    if(parseInt($('wob').value,10)<25) $('wob').value=45;
    schedule();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(b){
    b.addEventListener('click',function(){
      state.accent=b.getAttribute('data-c');
      Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false')});
      schedule();
    });
  });

  var msg=$('msg');
  function fileName(){ return 'racerun-'+fmtDist().replace(/[^0-9.]/g,'')+'km-'+state.w+'x'+state.h+'.png'; }
  var cached=null, tcache=0, _d=draw;
  draw=function(){
    _d(); cached=null; clearTimeout(tcache);
    tcache=setTimeout(function(){ cv.toBlob(function(b){ cached=b; },'image/png'); },300);
  };
  function withBlob(cb){
    draw();
    cv.toBlob(function(b){
      if(!b){ msg.textContent='Could not create the image. Try again.'; return; }
      cb(b);
    },'image/png');
  }
  function saveBlob(b){
    var url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download=fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    msg.textContent='Saved '+fileName();
  }
  function shareBlob(b){
    var f=new File([b],fileName(),{type:'image/png'});
    navigator.share({files:[f]}).catch(function(e){
      if(e&&e.name!=='AbortError') msg.textContent='Could not open the share menu. Use Download PNG instead.';
    });
  }
  $('dl').addEventListener('click',function(){ withBlob(saveBlob); });
  var canShareFiles=false;
  try{ canShareFiles=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[new File(['x'],'a.png',{type:'image/png'})]})); }catch(e){}
  if(!canShareFiles) $('share').hidden=true;
  $('share').addEventListener('click',function(){
    if(cached) shareBlob(cached); else withBlob(shareBlob);
  });

  draw();
  if(document.fonts&&document.fonts.load){
    Promise.all([document.fonts.load('900 205px Inter'),document.fonts.load('800 56px Inter'),document.fonts.load('500 31px Inter')])
      .then(draw).catch(draw);
    document.fonts.ready.then(draw);
  }
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
